<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#14110D" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Hombre Católico" />
<title>Mesa editorial — @hombre.catolico</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="stylesheet" href="/templates/tokens.css" />
<link rel="stylesheet" href="/templates/pieza.css" />
<link rel="stylesheet" href="/panel/styles.css" />
<script src="/templates/render.js"></script>
</head>
<body>
  <section class="login-shell" id="login-shell" hidden>
    <form class="login-card" id="login-form">
      <p class="eyebrow">Mesa editorial</p>
      <h1>Hombre Católico</h1>
      <p>Ingresá la clave para revisar y descargar los lotes desde tu celular.</p>
      <label for="password">Clave</label>
      <div class="password-field">
        <input id="password" name="password" type="password" autocomplete="current-password" aria-describedby="login-error" required />
        <button class="password-toggle" id="password-toggle" type="button" aria-controls="password" aria-pressed="false">Mostrar</button>
      </div>
      <button type="submit">Entrar</button>
      <p class="form-error" id="login-error" role="alert"></p>
    </form>
  </section>
  <div id="app-shell" hidden>
    <header class="topbar">
      <div>
        <p class="eyebrow">Mesa editorial</p>
        <h1>@hombre.catolico</h1>
      </div>
      <span class="sub" id="lote-info">Cargando lote…</span>
      <span class="grow"></span>
      <button class="secondary install-help" id="install-help" type="button">Instalar</button>
      <button class="secondary" id="logout" type="button">Salir</button>
      <button class="primary" id="generar" type="button">Generar 3 piezas</button>
    </header>
    <p class="network-status" id="network-status" role="status" aria-live="polite" hidden></p>
    <p class="generation-status" id="generation-status" aria-live="polite"></p>
    <div class="layout">
      <aside class="sidebar">
        <div class="selector-lote">
          <label for="lote-select">Lotes guardados</label>
          <select id="lote-select" aria-label="Elegir un lote guardado"></select>
        </div>
        <h2>Piezas del lote</h2>
        <div id="lista"></div>
      </aside>
      <main class="main">
        <div id="detalle" class="post-wrap"></div>
      </main>
    </div>
    <nav class="mobile-dock" id="mobile-dock" aria-label="Acciones de la pieza" hidden>
      <button type="button" class="dock-action" data-mobile-action="arte">Arte</button>
      <a class="dock-action" id="mobile-download" href="#">ZIP</a>
      <button type="button" class="dock-action" data-mobile-action="decision">Decisión</button>
    </nav>
  </div>
  <script src="/panel/app.js"></script>
</body>
</html>
