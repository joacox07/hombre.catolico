name: Publicar panel (Pages)

# Publica el panel de revisión en GitHub Pages. Se redeploya en cada push (así el panel se
# actualiza cuando el empleado commitea un lote nuevo) y a pedido.
# Requiere activar Pages una vez: Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: ["claude/hombre-catolico-instagram-ogg8ao"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Build del sitio
        run: npx tsx scripts/build-site.ts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
